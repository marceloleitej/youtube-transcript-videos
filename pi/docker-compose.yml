services:
  videos-pi:
    container_name: videos-pi
    build:
      context: ..
      dockerfile: pi/Dockerfile
    image: videos-pi:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-pt-BR}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      JOB_HISTORY_LIMIT: ${JOB_HISTORY_LIMIT:-50}
    # uvicorn --reload watches pi/ + core/ via watchfiles. With bind-mounts
    # below, editing the host files (or `scp`-ing new versions) triggers an
    # in-place reload — no `docker compose build` or `up` needed.
    command:
      - uvicorn
      - pi.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --proxy-headers
      - --reload
      - --reload-dir
      - /app/pi
      - --reload-dir
      - /app/core
    volumes:
      # Host path that Syncthing watches — must exist before `up`.
      # Defaults to the SSD pool Marcelo uses for sync folders.
      - ${OUTPUT_DIR:-/media/devmon/sda1-ata-UP_GAMER_1TB_UP2/Syncthing/videos-app}:/output
      # Bind-mount source so edits on the host hot-reload inside the container.
      # Read-only: the app never writes to its own source tree.
      - ../core:/app/core:ro
      - ./:/app/pi:ro
