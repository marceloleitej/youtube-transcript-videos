<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3460">
  <title>Videos Pi</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Videos <span class="accent">Pi</span></h1>
    <div class="status">
      {% if deepgram_configured %}
        <span class="dot ok"></span> Deepgram configurado
      {% else %}
        <span class="dot warn"></span> Sem Deepgram (transcricao desativada)
      {% endif %}
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Nova tarefa</h2>
      <form id="dl-form" autocomplete="off">
        <label for="url">URL do video</label>
        <input id="url" name="url" type="url" required
               placeholder="https://youtube.com/..."
               inputmode="url" autocapitalize="off" spellcheck="false">

        <div class="row">
          <fieldset class="format">
            <legend>Formato</legend>
            <label><input type="radio" name="format" value="mp4" checked> Video (mp4)</label>
            <label><input type="radio" name="format" value="mp3"> Audio (mp3)</label>
          </fieldset>

          <fieldset class="transcribe">
            <legend>Transcricao</legend>
            <label class="toggle">
              <input type="checkbox" id="transcribe" name="transcribe"
                     {% if not deepgram_configured %}disabled{% endif %}>
              <span>Transcrever depois de baixar</span>
            </label>
            <label for="language" class="lang-label">Idioma</label>
            <select id="language" name="language"
                    {% if not deepgram_configured %}disabled{% endif %}>
              {% for code, label in languages %}
                <option value="{{ code }}"
                  {% if code == default_language %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </fieldset>
        </div>

        <button type="submit" id="submit-btn">Adicionar a fila</button>
        <p class="hint">
          Saida vai para <code>{{ output_dir }}</code> (sincronizada com o PC via Syncthing).
        </p>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="card">
      <h2>Tarefas <span id="jobs-count" class="muted"></span></h2>
      <ul id="jobs" class="jobs">
        <li class="empty">Nenhuma tarefa ainda.</li>
      </ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
